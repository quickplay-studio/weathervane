name: companies

# Weekday mornings: TradingAgents company reports for the day's tickers. Research only, never feeds the signals.
on:
  schedule:
    - cron: "13 6 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma separated tickers (empty = today's rotation)"
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: weathervane-commit
  cancel-in-progress: false

jobs:
  companies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Install TradingAgents at the pinned ref
        continue-on-error: true
        run: |
          ref="$(python -c "import yaml; print(yaml.safe_load(open('config/engine.yaml'))['companies']['tradingagents_ref'])")"
          pip install "git+https://github.com/TauricResearch/TradingAgents.git@${ref}"
      - name: Company reports
        env:
          TICKERS: ${{ inputs.tickers }}
        run: python -m weathervane companies --minutes 17 --tickers "$TICKERS"
      - name: Commit reports
        run: |
          scripts/commit_push.sh "companies: reports $(date -u +%F)" reports/companies
