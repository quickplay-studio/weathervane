# Instruments and symbol maps. yf = yfinance ticker, oanda = OANDA v20 instrument, tv = TradingView symbol,
# alpaca_proxy = ETF used on the Alpaca paper account, cost_bps = round-trip cost estimate.
# contract_note is free text: verify every contract detail against the FTMO specification before an exam.
instruments:
